services:
  paint-together:
    build: .
    image: paint-together
    ports:
      - "3000:3000"
    volumes:
      - paint-data:/data
    restart: unless-stopped
    environment:
      # Password for the admin page at /admin (storage requests, featured pictures). Leave empty to turn it off.
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      # Storage each player gets for their own uploaded pictures, in MB.
      UPLOAD_QUOTA_MB: ${UPLOAD_QUOTA_MB:-100}

volumes:
  paint-data:
