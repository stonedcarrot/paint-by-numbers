# Public deployment: the game plus Caddy for automatic HTTPS (Let's Encrypt), locked down.
# Usage (from the repo root):
#   echo "DOMAIN=paint.example.com" > deploy/.env
#   echo "ADMIN_TOKEN=$(openssl rand -hex 24)" >> deploy/.env
#   docker compose -f deploy/docker-compose.https.yml --env-file deploy/.env up -d --build
x-hardening: &hardening
  restart: unless-stopped
  read_only: true                 # nothing can change the container's files, only its data volume
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  pids_limit: 200
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  paint-together:
    <<: *hardening
    build: ..
    image: paint-together
    environment:
      # Password for the admin page (storage requests, featured pictures). Leave empty to turn it off.
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      # Storage each player gets for their own uploaded pictures, in MB.
      UPLOAD_QUOTA_MB: ${UPLOAD_QUOTA_MB:-100}
    volumes:
      - paint-data:/data
    ports:
      # Only reachable from the server itself, for the admin page over an SSH tunnel.
      # Players always come in through Caddy.
      - "127.0.0.1:3000:3000"
    mem_limit: 768m

  caddy:
    <<: *hardening
    image: caddy:2
    depends_on:
      - paint-together
    cap_add:
      - NET_BIND_SERVICE          # the one permission Caddy needs, to listen on ports 80 and 443
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN, e.g. DOMAIN=paint.example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    mem_limit: 256m

volumes:
  paint-data:
  caddy-data:
  caddy-config:
