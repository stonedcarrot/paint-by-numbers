# nginx server block for the game. Add it next to your other site's config; nginx picks the block
# whose server_name matches the requested domain. Replace paint.example.com and the certificate paths.

server {
    listen 80;
    server_name paint.example.com;
    # keep this if certbot's webroot challenge is served from your nginx; otherwise just redirect
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name paint.example.com;

    ssl_certificate     /etc/letsencrypt/live/paint.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/paint.example.com/privkey.pem;

    client_max_body_size 10m;

    location / {
        # resolve the container name at request time so nginx still starts if the game is down
        resolver 127.0.0.11 valid=30s;
        set $paint http://paint-together:3000;
        proxy_pass $paint;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;      # WebSockets: painting syncs over /ws
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;                       # keep idle painters connected
    }
}
